<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Mauricio Pisco | Inicio</title>

		<link rel="stylesheet" href="./styles.css" />
		<link
			rel="shortcut icon"
			href="./assets/favicon.ico"
			type="image/x-icon"
		/>

		<!-- https://boxicons.com/ -->
		<link
			rel="stylesheet"
			href="https://unpkg.com/boxicons@latest/css/boxicons.min.css"
		/>

		<!-- https://remixicon.com/ -->
		<link
			href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
			rel="stylesheet"
		/>

		<!-- https://fonts.google.com/ -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Glory:wght@100..800&family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap"
		/>

		<!-- scroll reveal -->
		<script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>
		<script>
			ScrollReveal({
				reset: false,
				delay: 100,
				duration: 1000,
				distance: "100%",
			});
		</script>
		<script defer src="script.js" type="module"></script>
	</head>

	<body>
		<header>
			<p id="home-link" class="logo">
				<img src="./assets/logo.png" />jDev128
			</p>

			<div id="toggle-menu" class="bx bx-menu"></div>

			<nav id="navigation-list">
				<ul>
					<li id="skills-link">Herramientas y habilidades</li>
					<li id="projects-link">Ultimos proyectos</li>
				</ul>
			</nav>
		</header>

		<main>
			<aside class="social-media-bar">
				<nav>
					<ul>
						<li>
							<a id="linkedin" target="_blank" href=""
								><i class="ri-linkedin-box-fill"></i
							></a>
						</li>
						<li>
							<a id="github" target="_blank" href=""
								><i class="ri-github-fill"></i
							></a>
						</li>
					</ul>
				</nav>
			</aside>

			<section id="hero">
				<div id="hero-text">
					<h4 id="role-title"></h4>
					<h1 id="full-name"></h1>
					<p id="summary"></p>
					<a
						id="online-cv"
						class="button"
						target="_blank"
						href=""
						>Conocé mi trayectoria</a
					>
				</div>
				<div id="hero-img">
					<img src="" alt="" />
				</div>
			</section>

			<section id="tools-and-skills">
				<div id="tools" class="container">
					<h4>Mis herramientas</h4>
				</div>
				<div id="skills" class="container">
					<h4>Mis habilidades</h4>
				</div>
			</section>

			<section id="projects"></section>

			<div id="toggle-social-bar">
				<i class="ri-global-line"></i>
			</div>
		</main>
	</body>
</html>
